# Dependabot: one grouped pull request a week for minor and patch releases, majors on their own;
# security updates come as GitHub raises them. package-lock.json is what the box installs.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Port-au-Prince"
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
